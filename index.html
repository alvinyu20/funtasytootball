<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>League Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">LEAGUE<span>.</span></a>
    <ul class="nav-links">
      <li><a class="nav-link active" href="index.html">Home</a></li>
      <li><a class="nav-link" href="history.html">History</a></li>
      <li><a class="nav-link" href="teams.html">Teams</a></li>
      <li><a class="nav-link" href="season.html">Seasons</a></li>
      <li><a class="nav-link" href="records.html">Records</a></li>
      <li><a class="nav-link" href="newsletters.html">Newsletters</a></li>
    </ul>
  </nav>

  <section class="scoreboard">
    <p class="scoreboard-eyebrow" id="sb-eyebrow">SEASON</p>
    <h1 class="scoreboard-title" id="sb-title">Loading…</h1>
    <p class="scoreboard-sub" id="sb-sub"></p>
    <div class="scoreboard-ticker" id="sb-ticker"></div>
  </section>

  <div class="wrap">
    <div id="dash-error" class="error-state" style="display:none;"></div>
  </div>

  <div class="yard-divider">
    <span class="tick"></span>
    <div class="line"></div>
    <span class="label">On The Field</span>
    <div class="line"></div>
  </div>

  <main>
    <div class="section-grid">
      <div class="panel">
        <h2>Standings</h2>
        <table class="stat-table">
          <thead>
            <tr><th>#</th><th>Team</th><th>Record</th><th>PF</th></tr>
          </thead>
          <tbody id="standings-body">
            <tr><td colspan="4" class="loading">Loading standings…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel">
        <h2>This Week's Matchups</h2>
        <div class="matchup-list" id="matchups-list">
          <div class="loading">Loading matchups…</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Data pulled live from Sleeper. Refresh anytime for the latest scores.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sleeper-api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
