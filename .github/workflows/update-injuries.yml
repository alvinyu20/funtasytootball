name: Injury Data Pipeline

# Runs weekly on Tuesdays, an hour ahead of the Sleeper data pipeline
# (see sleeper-data-pipeline.yml) purely so the two don't both start at
# the exact same minute — this one pulls from nflverse/DynastyProcess,
# not Sleeper, so there's no ordering dependency between them.
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, without waiting for Tuesday

permissions:
  contents: write # needed to commit the regenerated data/injuries.json back to the repo

jobs:
  update-injuries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update injury data
        run: node scripts/update-injuries.js

      - name: Commit and push if data/injuries.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json
          if git diff --staged --quiet; then
            echo "No changes to data/injuries.json — nothing to commit."
          else
            git commit -m "Update injury data [automated]"
            git push
          fi
